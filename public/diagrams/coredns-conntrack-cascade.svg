<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" fill="none" role="img" aria-label="Kubernetes ndots 5 DNS amplification and nf_conntrack exhaustion cascade">
  <rect x="1" y="1" width="758" height="318" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1.5"/>
  <path d="M1 15C1 7.268 7.268 1 15 1H745C752.732 1 759 7.268 759 15V42H1V15Z" fill="#F4F4F1"/>
  <line x1="1" y1="42" x2="759" y2="42" stroke="#E4E4DF" stroke-width="1"/>
  <text x="24" y="26" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#18181B">DNS ndots:5 Amplification &amp; nf_conntrack Exhaustion Cascade</text>
  <text x="736" y="26" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#2558D9">Linux · CoreDNS · UDP</text>

  <!-- Step 1: App Pod -->
  <rect x="24" y="66" width="150" height="122" rx="10" fill="#F7F7F5" stroke="#E4E4DF" stroke-width="1.3"/>
  <text x="38" y="89" font-family="Figtree, ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#18181B">App Pod</text>
  <text x="38" y="108" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#2558D9">GET api.stripe.com</text>
  <line x1="36" y1="118" x2="162" y2="118" stroke="#E4E4DF"/>
  <text x="38" y="135" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#52525B">Default resolv.conf:</text>
  <text x="38" y="150" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#B91C1C">options ndots:5</text>
  <text x="38" y="167" font-family="Figtree, ui-sans-serif, sans-serif" font-size="9.5" fill="#6C6C78">2 dots &lt; 5 → tries</text>
  <text x="38" y="180" font-family="Figtree, ui-sans-serif, sans-serif" font-size="9.5" fill="#6C6C78">4 search suffixes first!</text>

  <!-- Arrow 1 -->
  <line x1="174" y1="127" x2="208" y2="127" stroke="#DC2626" stroke-width="2"/>
  <polygon points="208,122 218,127 208,132" fill="#DC2626"/>
  <text x="196" y="116" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#B91C1C">8–10×</text>
  <text x="196" y="143" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#B91C1C">UDP</text>

  <!-- Step 2: Search Amplification -->
  <rect x="218" y="66" width="234" height="122" rx="10" fill="#FEF8F8" stroke="#FCA5A5" stroke-width="1.3"/>
  <text x="230" y="88" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">A + AAAA Amplification</text>
  <text x="230" y="107" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.4" fill="#7F1D1D">1. api.stripe.com.ns.svc.cluster.local ✗</text>
  <text x="230" y="123" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.4" fill="#7F1D1D">2. api.stripe.com.svc.cluster.local    ✗</text>
  <text x="230" y="139" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.4" fill="#7F1D1D">3. api.stripe.com.cluster.local        ✗</text>
  <text x="230" y="155" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.4" fill="#7F1D1D">4. api.stripe.com.ec2.internal         ✗</text>
  <text x="230" y="172" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="700" fill="#1D4ED8">5. api.stripe.com. (Finally OK!)</text>

  <!-- Arrow 2 -->
  <line x1="452" y1="127" x2="478" y2="127" stroke="#DC2626" stroke-width="2"/>
  <polygon points="478,122 488,127 478,132" fill="#DC2626"/>

  <!-- Step 3: Conntrack + CoreDNS -->
  <rect x="490" y="66" width="246" height="122" rx="10" fill="#FEE2E2" stroke="#F87171" stroke-width="1.3"/>
  <text x="504" y="89" font-family="Figtree, ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Node conntrack &amp; CoreDNS</text>
  <text x="504" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#7F1D1D">nf_conntrack: table full, dropping</text>
  <text x="504" y="128" font-family="Figtree, ui-sans-serif, sans-serif" font-size="10.5" fill="#7F1D1D">• DNAT race drops UDP DNS packet</text>
  <text x="504" y="146" font-family="Figtree, ui-sans-serif, sans-serif" font-size="10.5" fill="#7F1D1D">• glibc waits exact 5s timeout to retry</text>
  <text x="504" y="164" font-family="Figtree, ui-sans-serif, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">• Mysterious p99 = 5.02s spikes!</text>

  <!-- Bottom Fix Bar -->
  <rect x="24" y="210" width="712" height="86" rx="10" fill="#EFF4FF" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="40" y="233" font-family="Figtree, ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Production 3-Part Fix (Cuts DNS Volume by 80% &amp; Eliminates 5s Spikes)</text>
  <text x="40" y="254" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.3" fill="#1E40AF">1. Deploy NodeLocal DNSCache (local TCP/link-local cache on every node, bypasses conntrack)</text>
  <text x="40" y="271" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.3" fill="#1E40AF">2. Set dnsConfig: { options: [{ name: "ndots", value: "2" }] }  (or trailing dot: api.stripe.com.)</text>
  <text x="40" y="288" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.3" fill="#1E40AF">3. Monitor node_nf_conntrack_entries / node_nf_conntrack_entries_limit &amp; alert &gt; 75%</text>
</svg>
