<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" fill="none" role="img" aria-label="Microservice retry amplification storm versus circuit breaker and retry budget">
  <rect x="1" y="1" width="758" height="318" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1.5"/>
  <path d="M1 15C1 7.268 7.268 1 15 1H745C752.732 1 759 7.268 759 15V42H1V15Z" fill="#F4F4F1"/>
  <line x1="1" y1="42" x2="759" y2="42" stroke="#E4E4DF" stroke-width="1"/>
  <text x="24" y="26" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#18181B">Retry Amplification Storm (3⁴ = 81× Load) vs. Retry Budget + Circuit Breaker</text>
  <text x="736" y="26" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#2558D9">SRE · Resilience</text>

  <!-- Row 1: Cascade Failure -->
  <rect x="24" y="58" width="712" height="110" rx="10" fill="#FEF8F8" stroke="#F4D3D3"/>
  <text x="38" y="80" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">UNBOUNDED RETRIES (3 retries at each hop → 100 RPS becomes 8,100 RPS at DB!)</text>

  <rect x="38" y="96" width="110" height="54" rx="8" fill="#FFFFFF" stroke="#E4E4DF"/>
  <text x="93" y="118" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Edge Gateway</text>
  <text x="93" y="136" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#52525B">100 RPS</text>

  <line x1="148" y1="123" x2="188" y2="123" stroke="#DC2626" stroke-width="2"/>
  <text x="168" y="114" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#DC2626">×3</text>

  <rect x="190" y="96" width="112" height="54" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="246" y="118" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Checkout API</text>
  <text x="246" y="136" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#B91C1C">300 RPS</text>

  <line x1="302" y1="123" x2="342" y2="123" stroke="#DC2626" stroke-width="2"/>
  <text x="322" y="114" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#DC2626">×3</text>

  <rect x="344" y="96" width="116" height="54" rx="8" fill="#FFFFFF" stroke="#F87171"/>
  <text x="402" y="118" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Payments Svc</text>
  <text x="402" y="136" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#B91C1C">900 RPS</text>

  <line x1="460" y1="123" x2="500" y2="123" stroke="#DC2626" stroke-width="2.5"/>
  <text x="480" y="114" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#DC2626">×9</text>

  <rect x="502" y="96" width="218" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="611" y="118" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Postgres / Downstream DB</text>
  <text x="611" y="136" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B91C1C">8,100 RPS → Total Collapse!</text>

  <!-- Row 2: Protected Architecture -->
  <rect x="24" y="186" width="712" height="112" rx="10" fill="#F4F7FE" stroke="#BFDBFE"/>
  <text x="38" y="208" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#1E40AF">RESILIENT DESIGN (Retry ONLY at single boundary + 10% Retry Budget + Full Jitter + Circuit Breaker)</text>

  <rect x="38" y="224" width="152" height="56" rx="8" fill="#FFFFFF" stroke="#93B4FA"/>
  <text x="114" y="246" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Single Retry Layer</text>
  <text x="114" y="264" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#2558D9">Max +10% retry budget</text>

  <line x1="190" y1="252" x2="226" y2="252" stroke="#2558D9" stroke-width="2"/>
  <polygon points="226,247 236,252 226,257" fill="#2558D9"/>

  <rect x="238" y="224" width="166" height="56" rx="8" fill="#FFFFFF" stroke="#93B4FA"/>
  <text x="321" y="246" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Backoff + Full Jitter</text>
  <text x="321" y="264" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#2558D9">rand(0, base * 2^n)</text>

  <line x1="404" y1="252" x2="440" y2="252" stroke="#2558D9" stroke-width="2"/>
  <polygon points="440,247 450,252 440,257" fill="#2558D9"/>

  <rect x="452" y="224" width="268" height="56" rx="8" fill="#2558D9"/>
  <text x="586" y="246" text-anchor="middle" font-family="Figtree, ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Circuit Breaker + Deadline Budget</text>
  <text x="586" y="264" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#DBEAFE">Fast-fails &lt;2ms · Downstream recovers!</text>
</svg>
