<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" role="img" aria-label="DevOps platform architecture and command reference preview">
  <defs>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2E323C" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Outer architectural frame -->
  <rect x="1" y="1" width="518" height="378" rx="16" fill="#23262D" stroke="#2E323C" stroke-width="1.5"/>
  <rect x="2" y="2" width="516" height="376" rx="15" fill="url(#grid-dark)" opacity="0.5"/>

  <!-- Top window bar -->
  <path d="M1 17C1 8.163 8.163 1 17 1H503C511.837 1 519 8.163 519 17V44H1V17Z" fill="#1B1D22"/>
  <line x1="1" y1="44" x2="519" y2="44" stroke="#2E323C" stroke-width="1"/>
  <circle cx="22" cy="22.5" r="4.5" fill="#3B404E"/>
  <circle cx="38" cy="22.5" r="4.5" fill="#3B404E"/>
  <circle cx="54" cy="22.5" r="4.5" fill="#3B404E"/>
  <text x="260" y="26.5" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#8B909E">devops-stack · production-ops</text>

  <!-- Section 1: Delivery Pipeline Topology -->
  <rect x="24" y="62" width="472" height="106" rx="12" fill="#1E2027" stroke="#2E323C" stroke-width="1.2"/>
  <text x="40" y="84" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8B909E">Delivery workflow</text>
  <text x="480" y="84" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#6B93F8">CI/CD → K8s</text>

  <!-- Connector line -->
  <line x1="88" y1="124" x2="432" y2="124" stroke="#353A47" stroke-width="2"/>
  <line x1="88" y1="124" x2="316" y2="124" stroke="#6B93F8" stroke-width="2.2"/>

  <!-- Node 1: Git -->
  <rect x="40" y="102" width="88" height="44" rx="9" fill="#252831" stroke="#343844" stroke-width="1.2"/>
  <circle cx="57" cy="124" r="4" fill="#6B93F8"/>
  <text x="68" y="120.5" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#F1F2F4">GitOps</text>
  <text x="68" y="134.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8B909E">PR · Tag</text>

  <!-- Node 2: Build -->
  <rect x="148" y="102" width="100" height="44" rx="9" fill="#252831" stroke="#343844" stroke-width="1.2"/>
  <circle cx="164" cy="124" r="4" fill="#6B93F8"/>
  <text x="175" y="120.5" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#F1F2F4">Build</text>
  <text x="175" y="134.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8B909E">OCI · SBOM</text>

  <!-- Node 3: Cluster (Active Focus) -->
  <rect x="268" y="100" width="102" height="48" rx="10" fill="#3B69E6"/>
  <rect x="278" y="114" width="8" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="278" y="126" width="8" height="8" rx="2" fill="#DBEAFE"/>
  <text x="294" y="120.5" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Cluster</text>
  <text x="294" y="135" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#DBEAFE">Rollout 3/3</text>

  <!-- Node 4: Observe -->
  <rect x="394" y="102" width="86" height="44" rx="9" fill="#252831" stroke="#343844" stroke-width="1.2"/>
  <circle cx="410" cy="124" r="4" fill="#D99B43"/>
  <text x="421" y="120.5" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#F1F2F4">OTel</text>
  <text x="421" y="134.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8B909E">Metrics</text>

  <!-- Section 2: Command Reference Surface (Left) + Stack Modules (Right) -->
  <rect x="24" y="184" width="302" height="172" rx="12" fill="#15171C" stroke="#2E323C" stroke-width="1.2"/>
  <text x="40" y="207" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8B909E">Quick commands</text>
  <line x1="25" y1="218" x2="325" y2="218" stroke="#262A34" stroke-width="1"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2">
    <text x="40" y="242" fill="#6B93F8" font-weight="700">$</text>
    <text x="54" y="242" fill="#E4E7EF">kubectl rollout status deploy/api</text>

    <text x="40" y="268" fill="#6B93F8" font-weight="700">$</text>
    <text x="54" y="268" fill="#E4E7EF">terraform plan -out=tfplan</text>

    <text x="40" y="294" fill="#6B93F8" font-weight="700">$</text>
    <text x="54" y="294" fill="#E4E7EF">docker buildx build --push .</text>

    <text x="40" y="320" fill="#6B93F8" font-weight="700">$</text>
    <text x="54" y="320" fill="#E4E7EF">trivy image --severity HIGH app</text>

    <text x="40" y="343" fill="#8B909E" font-size="10">20 tracks · 120+ cheatsheets · Ctrl+K</text>
  </g>

  <!-- Right Column: Architectural Domain Index Cards -->
  <rect x="342" y="184" width="154" height="50" rx="10" fill="#1E2027" stroke="#2E323C" stroke-width="1.2"/>
  <rect x="354" y="196" width="26" height="26" rx="7" fill="#232B42" stroke="#313E63" stroke-width="1"/>
  <path d="M362 205 L368 209 L362 213" stroke="#84A6FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="369" y1="213" x2="374" y2="213" stroke="#84A6FA" stroke-width="2" stroke-linecap="round"/>
  <text x="390" y="206" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F2F4">Linux &amp; CLI</text>
  <text x="390" y="221" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B909E">Daily ops &amp; kernel</text>

  <rect x="342" y="245" width="154" height="50" rx="10" fill="#1E2027" stroke="#2E323C" stroke-width="1.2"/>
  <rect x="354" y="257" width="26" height="26" rx="7" fill="#232B42" stroke="#313E63" stroke-width="1"/>
  <rect x="361" y="264" width="12" height="12" rx="2.5" stroke="#84A6FA" stroke-width="1.8"/>
  <line x1="367" y1="264" x2="367" y2="276" stroke="#84A6FA" stroke-width="1.5"/>
  <text x="390" y="267" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F2F4">Cloud &amp; IaC</text>
  <text x="390" y="282" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B909E">AWS, Azure, GCP</text>

  <rect x="342" y="306" width="154" height="50" rx="10" fill="#1E2027" stroke="#2E323C" stroke-width="1.2"/>
  <rect x="354" y="318" width="26" height="26" rx="7" fill="#2E261E" stroke="#4D3D2A" stroke-width="1"/>
  <path d="M367 324 L373 327 V332 C373 335.5 370.5 337.8 367 339 C363.5 337.8 361 335.5 361 332 V327 L367 324 Z" stroke="#D99B43" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="390" y="328" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F2F4">DevSecOps</text>
  <text x="390" y="343" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B909E">SAST, SLSA, Vault</text>
</svg>
